services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  app:
    build: .
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/agentliability
      PORT: "4000"
      PUBLIC_URL: http://localhost:4000
    ports:
      - "4000:4000"
    depends_on:
      - mongo

volumes:
  mongo-data:
